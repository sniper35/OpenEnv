[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-isaaclab-arena-env"
version = "0.1.0"
description = "IsaacLab Arena Environment for OpenEnv with a worker-backed Isaac Sim runtime adapter"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "isaaclab_arena_env.server.app:main"

[tool.setuptools]
packages = ["isaaclab_arena_env", "isaaclab_arena_env.server"]
package-dir = { "isaaclab_arena_env" = ".", "isaaclab_arena_env.server" = "server" }
